<!DOCTYPE html>
<html lang="en">

<body>

      <div class="brand"><div class="brand-icon" aria-hidden="true">✚</div><div><strong>Emergency Patient Queue</strong><span>Management System</span></div></div>
      <nav id="nav" aria-label="Main menu">
        <button data-view="dashboard" class="nav-item">⌂ <span>Dashboard</span></button>
        <button data-view="patients" class="nav-item">♟ <span>Patients</span></button>
        <button data-view="queue" class="nav-item">⚡ <span>Emergency Queue</span></button>

        <button data-view="treatments" class="nav-item">▣ <span>Treatments</span></button>
        <button data-view="statistics" class="nav-item">▥ <span>Statistics</span></button>
        <button data-view="data" class="nav-item">▤ <span>Data Management</span></button>

    <main class="main">

      </header>
      <div id="content" class="content" aria-live="polite"></div>
    </main>
  </div>
  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
